<!DOCTYPE html>
<html lang="zh-CN" data-theme="glass">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>GoShare 顺风拼车</title>
  <script>
    // 首屏主题内联：防闪烁（读 localStorage，默认 glass）
    try {
      var t = localStorage.getItem('goshare-theme') || 'glass';
      document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  </script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main-h5.ts"></script>
</body>
</html>
