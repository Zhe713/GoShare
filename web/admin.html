<!DOCTYPE html>
<html lang="zh-CN" data-theme="minimal">

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GoShare 管理后台</title>
  <script>
    try {
      var t = localStorage.getItem('goshare-theme') || 'minimal';
      document.documentElement.setAttribute('data-theme', t);

  </script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main-admin.ts"></script>
</body>
</html>
