<!DOCTYPE html>
<html lang="zh-CN" data-theme="aurora">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GoShare 运营大屏</title>
  <script>
    try {
      var t = localStorage.getItem('goshare-theme') || 'aurora';
      document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  </script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main-screen.ts"></script>
</body>
</html>
