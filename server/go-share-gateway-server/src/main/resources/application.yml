server:
  port: 8000

spring:
  application:
    name: go-share-gateway-server
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
    gateway:
      # 跨域（H5 本地开发用）
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
            allow-credentials: true
      routes:
        - id: user
          uri: lb://go-share-user-server
          predicates:
            - Path=/api/user/**,/api/driver/**
        - id: trip
          uri: lb://go-share-trip-server
          predicates:
            - Path=/api/trip/**
        - id: order
          uri: lb://go-share-order-server
          predicates:
            - Path=/api/order/**
          # 网关令牌桶限流（Redis 实现）：每秒补 20 个令牌、突发上限 40
          # key-resolver 必须显式指定，否则默认 PrincipalNameKeyResolver 对匿名请求返回空 → 直接放行（限流形同虚设）
          filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@clientIpKeyResolver}"
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 40
                redis-rate-limiter.requestedTokens: 1
        - id: marketing
          uri: lb://go-share-marketing-server
          predicates:
            - Path=/api/coupon/**
        - id: payment
          uri: lb://go-share-payment-server
          predicates:
            - Path=/api/payment/**
        - id: notify
          uri: lb://go-share-notify-server
          predicates:
            - Path=/api/notify/**
        - id: assistant
          uri: lb://go-share-assistant-server
          predicates:
            - Path=/api/assistant/**

# 项目自定义配置（与各服务一致的 JWT 密钥，网关统一校验登录）
goshare:
  jwt:
    secret: ${GOSHARE_JWT_SECRET:go-share-demo-jwt-secret-please-change-in-prod-0123456789}
    expire-hours: 24

management:
  endpoints:
    web:
      exposure:
        include: health,info
