server:
  port: 8003

spring:
  application:
    name: go-share-order-server
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
  datasource:
    url: jdbc:mysql://localhost:3306/goshare?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: root123
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: localhost
      port: 6379

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

# 项目自定义配置
goshare:
  jwt:
    secret: go-share-demo-jwt-secret-please-change-in-prod-0123456789
    expire-hours: 24
  order:
    # 待支付订单超时分钟数
    timeout-minutes: 15
    # 行程服务地址（Nacos 服务名 + 负载均衡）
    trip-service-url: http://go-share-trip-server
    # 券服务地址（用券结算/确认/退回）
    marketing-service-url: http://go-share-marketing-server

management:
  endpoints:
    web:
      exposure:
        include: health,info
