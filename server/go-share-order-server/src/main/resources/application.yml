server:
  port: 8003

spring:
  application:
    name: go-share-order-server
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
  data:
    redis:
      host: localhost
      port: 6379

# RocketMQ 消息队列（延时消息实现超时自动关闭）——配置前缀是顶层 rocketmq，不是 spring.rocketmq
rocketmq:
  name-server: localhost:9876
  producer:
    group: go-share-order-producer
  consumer:
    group: go-share-order-consumer

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

# 项目自定义配置
goshare:
  jwt:
    secret: go-share-demo-jwt-secret-please-change-in-prod-0123456789
    expire-hours: 24
  # 分库分表配置（ShardingSphere-JDBC 手动装配，逻辑表 trip_order 按乘客ID取模分 2 片）
  sharding:
    datasource-url: jdbc:mysql://localhost:3306/goshare?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    datasource-username: root
    datasource-password: root123
  order:
    # 待支付订单超时分钟数（RocketMQ 延时档位 10 分钟为主路径）
    timeout-minutes: 10
    # 定时扫描兜底超时（比延时消息晚 2 分钟，避免兜底抢先处理，保证延时消息路径可验证）
    scheduled-timeout-minutes: 12
    # 行程服务地址（Nacos 服务名 + 负载均衡）
    trip-service-url: http://go-share-trip-server
    # 券服务地址（用券结算/确认/退回）
    marketing-service-url: http://go-share-marketing-server

management:
  endpoints:
    web:
      exposure:
        include: health,info
