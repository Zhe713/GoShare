server:
  port: 8007

spring:
  application:
    name: go-share-assistant-server
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
  data:
    redis:
      host: localhost
      port: 6379
    elasticsearch:
      uris: localhost:9200
  datasource:
    url: jdbc:mysql://localhost:3306/goshare?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: root123
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

# 项目自定义配置
goshare:
  jwt:
    secret: go-share-demo-jwt-secret-please-change-in-prod-0123456789
    expire-hours: 24
  llm:
    # 模型接入方式：mock（默认，零成本可演示）| http（接真实 API）
    # 开源默认 mock：无需任何密钥即可跑通全部功能（规则关卡 + 工具链均为确定性实现）
    #
    # 三种配置 key 的方式（优先级从高到低）：
    #   1) 环境变量：GOSHARE_LLM_MODE=http  GOSHARE_LLM_API_KEY=你的key（CI / 容器推荐）
    #   2) 本地加密文件（推荐个人开发）：node scripts/llm-key.mjs set
    #      → ~/.goshare/goshare-llm.properties 存 ENC: 密文，主密钥在 ~/.goshare/master.key
    #      → 启动时由 LlmSecretEnvironmentPostProcessor 解密注入，明文不落盘、不进仓库
    #   3) 直接改本文件（不推荐，容易误提交）
    mode: ${GOSHARE_LLM_MODE:mock}
    http-url: ${GOSHARE_LLM_HTTP_URL:https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions}
    api-key: ${GOSHARE_LLM_API_KEY:}
    # 数据版本号：行程价格/余座/券规则变化时 +1，所有旧答案缓存自动作废（防止把旧数据答出去）
    data-version: 6
    # 模型档位：小模型（规则意图/轻量问答）/ 大模型（生成类）
    model: qwen-plus
    model-large: qwen-max
    # 固定前缀校验开关：所有 prompt 必须以系统前缀开头（保证缓存复用 + 防注入）
    prefix-check: true
  ai:
    # 服务间调用地址（Nacos 服务名 + 负载均衡）
    order-service-url: http://go-share-order-server
    trip-service-url: http://go-share-trip-server
    user-service-url: http://go-share-user-server
    notify-service-url: http://go-share-notify-server

management:
  endpoints:
    web:
      exposure:
        include: health,info
