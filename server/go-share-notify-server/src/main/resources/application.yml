server:
  port: 8006

spring:
  application:
    name: go-share-notify-server
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848

# 项目自定义配置
goshare:
  weather:
    # 天气数据源：http（真实数据·Open-Meteo 免费无 Key）| mock（内置演示数据，默认零外部依赖）
    # 已切真实数据：城市地理编码 + 实时 forecast，WMO 天气码转中文，实时更新
    mode: http
  notify:
    # 订单服务地址（发车提醒：取订单/行程信息）
    order-service-url: http://go-share-order-server
    trip-service-url: http://go-share-trip-server

management:
  endpoints:
    web:
      exposure:
        include: health,info
