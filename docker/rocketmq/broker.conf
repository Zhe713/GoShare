# GoShare RocketMQ broker 配置
brokerClusterName=GoShareCluster
brokerName=broker-a
brokerId=0
deleteWhen=04
fileReservedTime=48
brokerRole=ASYNC_MASTER
flushDiskType=ASYNC_FLUSH
autoCreateTopicEnable=true
storePathRootDir=/home/rocketmq/store
storePathCommitLog=/home/rocketmq/store/commitlog
namesrvAddr=goshare-rocketmq-namesrv:9876
# 显式指定对外可访问地址：容器注册默认用容器内网IP，Windows(WSL2)宿主机无法路由，
# 必须注册 127.0.0.1（配合宿主端口映射 10911/10912），否则 Java 侧发送/消费全部超时
brokerIP1=127.0.0.1
