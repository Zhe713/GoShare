# GoShare 顺风拼车平台 - 本地开发环境
# 阶段 0：核心中间件（后续阶段按需追加 Sentinel / XXL-Job / Skywalking）

name: goshare-dev

services:
  mysql:
    image: mysql:8.0
    container_name: goshare-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: goshare
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ../sql:/docker-entrypoint-initdb.d:ro
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.2-alpine
    container_name: goshare-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  rocketmq-namesrv:
    image: apache/rocketmq:4.9.7
    container_name: goshare-rocketmq-namesrv
    command: sh mqnamesrv
    ports:
      - "9876:9876"
    environment:
      TZ: Asia/Shanghai

  rocketmq-broker:
    image: apache/rocketmq:4.9.7
    container_name: goshare-rocketmq-broker
    depends_on:
      - rocketmq-namesrv
    command: sh mqbroker -n goshare-rocketmq-namesrv:9876 -c /home/rocketmq/conf/broker.conf
    ports:
      - "10909:10909"
      - "10911:10911"
      - "10912:10912"
    environment:
      TZ: Asia/Shanghai
    volumes:
      - ./rocketmq/broker.conf:/home/rocketmq/conf/broker.conf:ro

  rocketmq-dashboard:
    image: apacherocketmq/rocketmq-dashboard:1.0.0
    container_name: goshare-rocketmq-dashboard
    depends_on:
      - rocketmq-namesrv
    environment:
      JAVA_OPTS: -Drocketmq.namesrv.addr=goshare-rocketmq-namesrv:9876 -Drocketmq.name.server.addr=goshare-rocketmq-namesrv:9876
    ports:
      - "8081:8080"

  elasticsearch:
    image: elasticsearch:8.13.4
    container_name: goshare-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
      TZ: Asia/Shanghai
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    ulimits:
      memlock:
        soft: -1
        hard: -1

  # minio 暂缓：当前镜像加速源对 minio 仓库返回 denied（阶段 3 需要对象存储前换源启用）
  # minio:
  #   image: minio/minio:latest
  #   container_name: goshare-minio
  #   command: server /data --console-address ":9001"
  #   environment:
  #     MINIO_ROOT_USER: goshare
  #     MINIO_ROOT_PASSWORD: goshare123
  #   ports:
  #     - "9000:9000"
  #     - "9001:9001"
  #   volumes:
  #     - minio-data:/data

  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: goshare-nacos
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
      JVM_XMS: 256m
      JVM_XMX: 512m
    ports:
      - "8848:8848"
      - "9848:9848"

volumes:
  mysql-data:
  redis-data:
  es-data:
  # minio-data:  # minio 暂缓时保留卷定义注释
  # rmq-namesrv:  # RocketMQ 暂不挂卷（镜像内部路径权限稳定）
  # rmq-broker:
  # rmq-broker-store:
