name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: 后端 · Jacoco 覆盖率 ≥70% 门禁
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Maven verify（单测 + 模块级行覆盖门禁）
        run: mvn -B clean verify --file server/pom.xml
      - name: 上传 Jacoco 覆盖率报告
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: |
            server/go-share-user-server/target/site/jacoco/
            server/go-share-trip-server/target/site/jacoco/
            server/go-share-order-server/target/site/jacoco/
            server/go-share-marketing-server/target/site/jacoco/
            server/go-share-payment-server/target/site/jacoco/
            server/go-share-assistant-server/target/site/jacoco/
            server/go-share-notify-server/target/site/jacoco/

  frontend:
    name: 前端 · 类型 / 单测 / 裸样式门禁
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: 安装依赖
        run: npm ci
      - name: vue-tsc 类型检查 + 构建
        run: npm run build
      - name: vitest 单测
        run: npm test
      - name: Stylelint 裸样式门禁（禁裸色值/裸字号/裸间距，强制设计 token）
        run: npm run lint:style

  e2e:
    name: E2E · 主链路（登录→语义搜索→下单→支付）+ AI 助手
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: 启动基础设施（MySQL/Redis/ES/Nacos/RocketMQ）
        run: docker compose -f docker/docker-compose.yml up -d
      - name: 打包后端 fat jar
        run: mvn -B package -DskipTests --file server/pom.xml
      - name: 后台启动 8 个后端服务 + 等待就绪
        run: |
          for m in user trip order marketing payment notify assistant gateway; do
            nohup java -jar server/go-share-$m-server/target/go-share-$m-server-0.0.1-SNAPSHOT.jar > logs-$m.txt 2>&1 &
          done
          for p in 8000 8001 8002 8003 8004 8005 8006 8007; do
            for i in $(seq 1 60); do
              if (echo > /dev/tcp/127.0.0.1/$p) 2>/dev/null; then break; fi
              sleep 2
            done
          done
          echo "backend ports ready"
      - name: 启动 vite dev server
        run: |
          nohup npx vite --config vite.config.ts > vite.log 2>&1 &
          for i in $(seq 1 30); do
            if (echo > /dev/tcp/127.0.0.1/5173) 2>/dev/null; then break; fi
            sleep 2
          done
          echo "vite ready"
        working-directory: web
      - name: 安装 Playwright 浏览器
        run: npx playwright install chromium
        working-directory: web
      - name: 运行 E2E 主链路
        run: npx playwright test
        working-directory: web
      - name: 上传 E2E 报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/test-results/
