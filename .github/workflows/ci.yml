name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: 后端 · Jacoco 覆盖率 ≥70% 门禁
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Maven verify（单测 + 模块级行覆盖门禁）
        run: mvn -B clean verify --file server/pom.xml
      - name: 上传 Jacoco 覆盖率报告
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: |
            server/go-share-user-server/target/site/jacoco/
            server/go-share-trip-server/target/site/jacoco/
            server/go-share-order-server/target/site/jacoco/
            server/go-share-marketing-server/target/site/jacoco/
            server/go-share-payment-server/target/site/jacoco/
            server/go-share-assistant-server/target/site/jacoco/
            server/go-share-notify-server/target/site/jacoco/

  frontend:
    name: 前端 · 类型 / 单测 / 裸样式门禁
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: 安装依赖
        run: npm ci
      - name: vue-tsc 类型检查 + 构建
        run: npm run build
      - name: vitest 单测
        run: npm test
      - name: Stylelint 裸样式门禁（禁裸色值/裸字号/裸间距，强制设计 token）
        run: npm run lint:style

  e2e:
    name: E2E · 主链路（登录→语义搜索→下单→支付）+ AI 助手
    runs-on: ubuntu-latest
    env:
      # 与容器 TZ=Asia/Shanghai 对齐：否则 runner(UTC) 与 MySQL/服务时区不一致，
      # 订单 created_at 会被算成 8 小时前，收银台直接显示"已超时"
      TZ: Asia/Shanghai
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: 启动基础设施（MySQL/Redis/ES/Nacos/RocketMQ）
        # --wait：等所有带 healthcheck 的服务真正 healthy 再继续（否则 MySQL 初始化失败时脚本会静默继续）
        run: docker compose -f docker/docker-compose.yml up -d --wait --wait-timeout 300

      - name: 等待中间件就绪（MySQL 建表 + Nacos 可注册）
        run: |
          # 不能用 mysqladmin ping 判断：初始化脚本执行期间 server 就已经能 ping 通，
          # 此时建表还没跑完，服务起来会 500。要等"表 + 种子数据"真的可用。
          ready=0
          for i in $(seq 1 90); do
            if docker exec goshare-mysql mysql -uroot -proot123 -N -e \
                 "SELECT COUNT(*) FROM goshare.user WHERE phone='13900139000'" 2>/dev/null | grep -q '^1$'; then
              ready=1; echo "mysql schema + seed ready"; break
            fi
            sleep 2
          done
          if [ "$ready" != "1" ]; then
            echo "::error::MySQL 未就绪（建表或种子脚本可能失败）"
            docker ps -a
            docker logs --tail 120 goshare-mysql
            exit 1
          fi
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8848/nacos/ || true)
            if [ "$code" = "200" ] || [ "$code" = "302" ]; then echo "nacos ready"; break; fi
            sleep 2
          done
      - name: 打包后端 fat jar
        run: mvn -B package -DskipTests --file server/pom.xml
      - name: 后台启动 8 个后端服务 + 等待就绪
        run: |
          # 注册到 127.0.0.1：CI 上服务跑在宿主、Nacos 在容器，避免注册成不可路由的网卡地址
          for m in user trip order marketing payment notify assistant gateway; do
            nohup java -jar server/go-share-$m-server/target/go-share-$m-server-0.0.1-SNAPSHOT.jar \
              --spring.cloud.nacos.discovery.ip=127.0.0.1 \
              -Duser.timezone=Asia/Shanghai > logs-$m.txt 2>&1 &
          done
          for p in 8000 8001 8002 8003 8004 8005 8006 8007; do
            for i in $(seq 1 60); do
              if (echo > /dev/tcp/127.0.0.1/$p) 2>/dev/null; then break; fi
              sleep 2
            done
          done
          echo "backend ports ready"
          # 端口通 ≠ 已注册到 Nacos：再等 20s 让 8 个实例完成注册，避免网关 503
          sleep 20
          echo "wait for nacos registration done"
      - name: 安装前端依赖
        run: npm ci
        working-directory: web

      - name: 安装 Playwright 浏览器
        run: npx playwright install --with-deps chromium
        working-directory: web
      - name: 运行 E2E 主链路
        run: npx playwright test
        working-directory: web
      - name: 失败时输出后端服务日志（定位 E2E 500 的现场）
        if: failure()
        run: |
          for f in logs-*.txt; do
            echo "===== $f ====="
            tail -80 "$f" || true
          done

      - name: 上传后端服务日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-logs
          path: logs-*.txt

      - name: 上传 E2E 报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/test-results/
